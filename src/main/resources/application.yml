server:
  port: 8081          # 8080 被 web-quiz-admin 的 Vue dev server 占了，这里让开
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: quiz-java
  datasource:
    # 本机 MySQL 装在 E 盘，端口 3306；参数见 README「本机环境」
    url: jdbc:mysql://127.0.0.1:3306/quiz_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: quiz
    password: quiz123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000

mybatis:
  # XML 映射文件的位置
  mapper-locations: classpath:mapper/*.xml
  configuration:
    # 下划线列名 → 驼峰属性，QuestionMapper 里虽然有 resultMap，这里也开上，别的表就不用重复写
    map-underscore-to-camel-case: true
    # 控制台打印 SQL，方便对照课堂讲的"MyBatis 到底发了什么 SQL"
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.lingrui.quiz.mapper: debug
